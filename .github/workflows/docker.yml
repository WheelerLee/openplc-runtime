name: Build and Publish ARMv7 Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Image version without the v prefix (e.g., 1.2.3)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: docker-mirror.blueorigintech.com:5000
          username: ${{ secrets.LY_LW_DOCKER_USER }}
          password: ${{ secrets.LY_LW_DOCKER_PASS }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker-mirror.blueorigintech.com:5000/lanyuan/openplc-runtime
          tags: |
            # Git tag v1.2.3 becomes image tag 1.2.3-armv7.
            type=semver,pattern={{version}}-armv7
            # Manual runs accept a version without the v prefix.
            type=raw,value=${{ inputs.release_tag }}-armv7,enable=${{ inputs.release_tag != '' }}

      - name: Build and Push ARMv7 Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the GitHub release tag (or the workflow_dispatch
          # release_tag override) into the image so /api/version can
          # report it back to clients.  Falls back to the Dockerfile
          # default ("dev") for ad-hoc builds without a release tag.
          build-args: |
            RUNTIME_VERSION=${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
