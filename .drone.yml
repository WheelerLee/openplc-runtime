kind: pipeline
type: docker
name: build-armv7

node:
  per: 6C16G

steps:
  - name: build-and-push
    image: docker:27-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      username:
        from_secret: LY_LW_DOCKER_USER
      password:
        from_secret: LY_LW_DOCKER_PASS
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - |
        set -eu

        attempt=0
        until docker info >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$${attempt}" -ge 60 ]; then
            echo "Docker daemon did not become ready within 120 seconds." >&2
            docker info || true
            exit 1
          fi
          echo "Waiting for the Docker daemon..."
          sleep 2
        done

        case "$${DRONE_TAG:-}" in
          v?*)
            VERSION="$${DRONE_TAG#v}"
            ;;
          *)
            echo "A Git tag beginning with 'v' is required (for example: v1.0.0)." >&2
            exit 1
            ;;
        esac

        IMAGE="docker-mirror.blueorigintech.com:5000/lanyuan/openplc-runtime"
        IMAGE_TAG="$${VERSION}-armv7"
        BUILDER_NAME="openplc-armv7-$${DRONE_BUILD_NUMBER}"

        cleanup() {
          docker buildx rm "$${BUILDER_NAME}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        echo "$${password}" | docker login \
          docker-mirror.blueorigintech.com:5000 \
          --username "$${username}" \
          --password-stdin

        docker run --privileged --rm tonistiigi/binfmt:latest --install arm
        docker buildx rm "$${BUILDER_NAME}" >/dev/null 2>&1 || true
        docker buildx create \
          --name "$${BUILDER_NAME}" \
          --driver docker-container \
          --use
        docker buildx inspect --bootstrap

        docker buildx build \
          --platform linux/arm/v7 \
          --build-arg "RUNTIME_VERSION=$${DRONE_TAG}" \
          --tag "$${IMAGE}:$${IMAGE_TAG}" \
          --push \
          .

volumes:
  - name: docker-socket
    host:
      path: /var/run/docker.sock

trigger:
  event:
    - tag
  ref:
    - refs/tags/v*
